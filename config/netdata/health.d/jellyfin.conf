# jellyfin_up is scraped by jellyfin-exporter against the live HTTP API, so a 0
# means the server is reachable-but-broken (process up, API/DB hung) — a state
# the container healthcheck + dolce path can miss. The 5m down-delay avoids
# flapping during the nightly library scan / DB vacuum.
    alarm: jellyfin_api_down
       on: prometheus_jellyfin.jellyfin_up
    class: Errors
     type: Media Server
component: Jellyfin
   lookup: max -1m of jellyfin_up
    units: up
    every: 30s
     crit: $this < 1
    delay: down 5m
     info: Jellyfin API is not responding (jellyfin_up=0)
       to: sysadmin
