# Bufferbloat detection for the WAN uplink. This APPENDS to the stock
# health.d/ping.conf rather than replacing it: netdata keys health config by
# template name, and same-named files in the user dir shadow the stock file, so
# both the filename AND the template name here are deliberately distinct from the
# stock ping_host_latency / ping_packet_loss / ping_host_reachable alarms, which
# keep firing unchanged.
#
# Bufferbloat is latency-under-load: when qBittorrent saturates the uplink the
# modem's tx queue fills and RTT to the internet jumps from a ~7ms baseline into
# the hundreds of ms, which is what makes clients' connectivity checks (and thus
# WiFi association) time out. Read this alongside the native net.eno1 throughput
# chart -- an RTT spike coinciding with saturated TX is the confirmation.
#
# Scoped to the internet ping targets via `chart labels: host=!192.168.* *`: the
# LAN gateway's bmaxbox->router RTT does not traverse the WAN modem queue, so it
# would not reflect bufferbloat. Thresholds sit far above the measured ~7ms
# baseline; retune if the uplink's idle RTT differs.

 template: ping_uplink_bufferbloat
       on: ping.host_rtt
    class: Latency
     type: Other
component: Network
chart labels: host=!192.168.* *
   lookup: average -30s unaligned of avg
    units: ms
    every: 10s
     warn: $this > 100 OR $max > 250
     crit: $this > 250
    delay: down 5m multiplier 1.5 max 1h
  summary: Uplink bufferbloat to ${label:host}
     info: Average RTT to ${label:host} over 30s is elevated (WAN uplink likely saturated / bufferbloated)
       to: sysadmin
