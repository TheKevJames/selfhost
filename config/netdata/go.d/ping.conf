## All available configuration options, their descriptions and default values:
## https://github.com/netdata/netdata/tree/master/src/go/plugin/go.d/collector/ping#readme

# Passive latency sampler for diagnosing intermittent client connectivity
# (suspected WAN bufferbloat from qBittorrent saturating the uplink). netdata
# already charts eno1 throughput (net.*) and nf_conntrack natively; this adds
# RTT + packet loss so a latency spike can be lined up on one timeline against an
# uplink-saturation episode. The stock health.d/ping.conf alerts
# (ping_host_latency / ping_packet_loss / ping_host_reachable) fire off these
# metrics automatically.

# privileged: no is REQUIRED here: the netdata container runs without
# CAP_NET_RAW, so raw ICMP (the default) fails. Unprivileged UDP ping works only
# because the host sets net.ipv4.ping_group_range to "0 2147483647".
update_every: 2

jobs:
  # LAN path health (bmaxbox -> router). Isolates whether a spike is local-LAN
  # vs the internet uplink.
  - name: lan_gateway
    privileged: no
    network: ip4
    hosts:
      - 192.168.1.1

  # WAN uplink health. RTT here ballooning while net.eno1 TX is saturated is the
  # bufferbloat signature that would explain clients failing their connectivity
  # checks. Two anycast targets guard against one provider hiccuping.
  - name: internet
    privileged: no
    network: ip4
    hosts:
      - 1.1.1.1
      - 8.8.8.8
