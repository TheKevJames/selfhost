services:
  # TODO: integrate with beszel, once it supports custom metrics
  # atc1441-exporter:
  #   container_name: atc1441-exporter
  #   image: quay.io/thekevjames/atc1441-exporter:0.1.9
  #   command: --port=9091 /app/config.ini
  #   restart: unless-stopped
  #   environment:
  #     - DEBUG=false
  #   network_mode: host
  #   privileged: true
  #   volumes:
  #     - ./config/atc1441/config.ini:/app/config.ini:Z

  bazarr:
    container_name: bazarr
    image: quay.io/linuxserver.io/bazarr:1.6.2
    restart: unless-stopped
    ports:
      - 6767:6767/tcp
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - ./data/bazarr:/config:Z
      - /mnt/4tb/movies:/data/media/movies
      - /mnt/8tb/shows:/data/media/shows

  beszel:
    container_name: beszel
    image: ghcr.io/henrygd/beszel/beszel:0.21.1
    restart: unless-stopped
    environment:
      - APP_URL=https://beszel.thekev.in
      - AUTO_LOGIN=kevin.j.carruthers@gmail.com
      - DISABLE_PASSWORD_AUTH=true
      - TRUSTED_AUTH_HEADER=Cf-Access-Authenticated-User-Email
      - TRUSTED_PROXY_IPS=172.18.0.0/16
      - USER_EMAIL=kevin.j.carruthers@gmail.com
      # N.B. uncomment for bootstrapping, then change password
      # - USER_PASSWORD=a-strong-temporary-password
    ports:
      - 8090:8090
    volumes:
      - ./data/beszel/hub:/beszel_data:Z
      - ./data/beszel/socket:/beszel_socket
    healthcheck:
      test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
      interval: 120s
      start_period: 10s
      timeout: 5s

  beszel-agent:
    container_name: beszel-agent
    image: ghcr.io/henrygd/beszel/beszel-agent:0.21.1-alpine
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./secrets/beszel.env
    environment:
      - DISK_USAGE_CACHE=1h
      # - DOCKER_HOST=docker-socket-proxy:2375  # TODO: switch to docket proxy
      - HUB_URL=https://beszel.thekev.in
      - LISTEN=/beszel_socket/beszel.sock
      - SKIP_GPU=true
      - SKIP_SYSTEMD_LOGS=true
      - SKIP_WIFI=true
    volumes:
      - ./data/beszel/agent:/var/lib/beszel-agent:Z
      - ./data/beszel/socket:/beszel_socket
      - /mnt/4tb/.beszel:/extra-filesystems/4tb:ro
      - /mnt/8tb/.beszel:/extra-filesystems/8tb:ro
      - /mnt/ssd/.beszel:/extra-filesystems/ssd:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - /var/run/systemd/private:/var/run/systemd/private:ro  # TODO: do I need this?
    healthcheck:
      test: ['CMD', '/agent', 'health']
      interval: 120s

  bookorbit:
    container_name: bookorbit
    image: ghcr.io/bookorbit/bookorbit:3.6.0
    restart: unless-stopped
    init: true
    ports:
      - 3000:3000/tcp
    env_file:
      - ./secrets/bookorbit.env
      - ./secrets/bookorbit_postgres.env
    environment:
      - APP_URL=https://bookorbit.thekev.in
      - BOOKS_HOST_PATH=/books
      - CLIENT_URL=https://bookorbit.thekev.in
      - DISABLE_LOCAL_AUTH=false  # TODO: defer to cloudflared oauth
      - LIBRARY_BROWSE_ROOT=/books
      - NODE_ENV=production
      - NODE_MAX_OLD_SPACE_SIZE=2048
      - PGID=1000
      - PORT=3000
      - POSTGRES_HOST=bookorbit-postgres
      - POSTGRES_PORT=5432
      - PUID=1000
      - TZ=Etc/UTC
    depends_on:
      bookorbit-postgres:
        condition: service_healthy
    volumes:
      - ./data/bookorbit/app:/data
      - /mnt/4tb/sync/books:/books
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  bookorbit-postgres:
    container_name: bookorbit-postgres
    image: docker.io/pgvector/pgvector:pg18
    restart: unless-stopped
    env_file:
      - ./secrets/bookorbit_postgres.env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./data/bookorbit/db:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cloudflared:
    container_name: cloudflared
    image: docker.io/cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: tunnel run
    restart: unless-stopped
    volumes:
      - ./data/cloudflared:/home/nonroot/.cloudflared:Z

  docker-socket-proxy:
    container_name: docker-socket-proxy
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=0
      - SERVICES=0
      - TASKS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dolce:
    container_name: dolce
    image: docker.io/dangrie158/dolce:v4.0.2
    restart: unless-stopped
    env_file:
      - ./secrets/dolce.env
    environment:
      - DOCKER_HOST=docker-socket-proxy:2375
      - DOCKER_TRANSPORT=tcp
      - DOLCE_EVENTS=start,die,kill,oom,stop,pause,unpause,health_status
      # MULTIPLIER=1 keeps the notification delay flat at MIN_TIMEOUT instead of
      # exponentially backing off into hours-long batches during event bursts.
      - DOLCE_MULTIPLIER=1
      - DOLCE_MIN_TIMEOUT=10
      - TZ=Etc/UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  fava:
    container_name: fava
    image: quay.io/thekevjames/fava:1.30.16
    command: /data/finance/index.beancount
    restart: unless-stopped
    volumes:
      - /mnt/4tb/sync/finance:/data/finance

  gerbera:
    container_name: gerbera
    image: docker.io/gerbera/gerbera:3.3.0
    command: gerbera -p 49152 -c /etc/gerbera/config.xml
    restart: unless-stopped
    cpus: 0.5
    cpu_shares: 768
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Etc/UTC
    network_mode: host
    volumes:
      - ./data/gerbera:/etc/gerbera:Z
      - /mnt/4tb/movies:/content/movies:ro
      - /mnt/8tb/shows:/content/shows:ro
      - gerbera:/var/run/gerbera

  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v2.7.0
    restart: unless-stopped
    env_file:
      - ./secrets/homepage.env
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.thekev.in
    volumes:
      - /mnt/ssd:/mnt/ssd
      - ./config/homepage:/app/config:Z

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5
    restart: always
    cpus: 1.0
    cpu_shares: 256
    user: '1000:1000'
    environment:
      - ORT_DISABLE_TELEMETRY=1
    env_file:
      - config/immich/config.env
      - secrets/immich.env
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false

  immich-postgres:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3
    restart: always
    environment:
      POSTGRES_INITDB_ARGS: '--data-checksums'
    env_file:
      - config/immich/config.env
      - secrets/immich.env
    volumes:
      - ./data/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9.1.3
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1

  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:v3.3.5
    restart: always
    user: '1000:1000'
    ports:
      - '2283:2283'
    env_file:
      - config/immich/config.env
      - secrets/immich.env
    volumes:
      - /mnt/4tb/backup/library:/data
      - /mnt/4tb/backup/library-bigfiles:/mnt/bigfiles:ro
      - /mnt/4tb/backup/library-bigfiles-chris:/mnt/bigfiles-chris:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - immich-postgres
      - immich-redis
    healthcheck:
      disable: false

  jellyfin:
    container_name: jellyfin
    image: quay.io/linuxserver.io/jellyfin:10.11.11
    restart: unless-stopped
    ports:
      - 7359:7359/udp
      - 8096:8096/tcp
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - /mnt/4tb/movies:/data/media/movies
      - /mnt/8tb/shows:/data/media/shows
      - ./data/jellyfin:/config:Z
      # https://github.com/linuxserver/docker-jellyfin/blob/master/root/etc/s6-overlay/s6-rc.d/svc-jellyfin/run
      # jellyfin's DB lives at /config/data, now under the ./data/jellyfin bind mount
      - /config/cache
      - /config/log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:2.47.0
    restart: unless-stopped
    environment:
      - GENERIC_TIMEZONE=Etc/UTC
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=1000
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_METRICS=false
      - N8N_HOST=n8n.thekev.in
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_RUNNERS_AUTH_TOKEN=no-need-to-be-secret
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - NODE_ENV=production
      - NODES_EXCLUDE="[]"
      - WEBHOOK_URL=https://n8n.thekev.in/
    volumes:
      - ./config/n8n:/files
      - ./data/n8n/data:/home/node/.n8n
      - ./data/n8n/files:/home/node/.n8n-files

  n8n-runners:
    container_name: n8n-runners
    image: docker.io/n8nio/runners:2.47.0
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=no-need-to-be-secret
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=0
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    depends_on:
      - n8n

  prowlarr:
    container_name: prowlarr
    image: quay.io/linuxserver.io/prowlarr:2.7.0
    restart: unless-stopped
    ports:
      - 9696:9696/tcp
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - ./data/prowlarr:/config:Z

  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent:release-5.3.0
    restart: unless-stopped
    ports:
      - 8089:8080/tcp
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - /mnt/8tb/torrents:/data/torrents
      - ./data/qbittorrent:/config:Z

  radarr:
    container_name: radarr
    image: quay.io/linuxserver.io/radarr:6.4.4
    restart: unless-stopped
    ports:
      - 7878:7878/tcp
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - /mnt/8tb/torrents:/data/torrents
      - /mnt/4tb/movies:/data/media/movies
      - ./data/radarr:/config:Z

  sonarr:
    container_name: sonarr
    image: quay.io/linuxserver.io/sonarr:4.0.20
    restart: unless-stopped
    ports:
      - 8989:8989/tcp
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - /mnt/8tb/torrents:/data/torrents
      - /mnt/8tb/shows:/data/media/shows
      - ./data/sonarr:/config:Z

  syncthing:
    container_name: syncthing
    image: quay.io/linuxserver.io/syncthing:2.1.7
    restart: unless-stopped
    cpus: 0.5
    cpu_shares: 512
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - /mnt/4tb/backup:/data/backup
      - /mnt/4tb/sync:/data/sync
      - ./data/syncthing:/config:Z

  unpackerr:
    container_name: unpackerr
    image: ghcr.io/hotio/unpackerr:release-0.15.2
    restart: unless-stopped
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - /mnt/8tb/torrents:/data/torrents
      - ./config/unpackerr:/config:Z

# Persistent app state lives under ./data; these named volumes
# hold only regenerable caches / runtime scratch and are intentionally excluded
# from backups.
volumes:
  gerbera: {}
  model-cache: {}
